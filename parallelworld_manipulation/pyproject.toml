[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "parallelworld-manipulation"
version = "0.1.0"
authors = [
    { name = "Min Chen" },
    { name = "Shengjun Zhang" },
    { name = "Yuxin Li" },
    { name = "Zhang Zhang" },
    { name = "Xin Fei" },
    { name = "Chong Xia" },
    { name = "Yueqi Duan" },
]
description = "Prospective world imagination for agentic robotic manipulation"
readme = {file = "README.md", content-type = "text/markdown"}
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
keywords = [
    "embodied-intelligence",
    "large-language-models",
    "agent-framework",
]
classifiers = [
    #   2 - Pre-Alpha
    #   3 - Alpha
    #   4 - Beta
    #   5 - Production/Stable
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: GPU :: NVIDIA CUDA :: 12 :: 12.4",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://agenticei.github.io/ParallelWorld-page/"
Repository = "https://github.com/AgenticEI/ParallelWorld"
Paper = "https://arxiv.org/abs/2608.22971"

dependencies = [
    "pydantic-ai-slim[anthropic,openai]>=2.1",
    "pydantic>=2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "httpx>=0.27",
    "claude-agent-sdk>=0.1.60",
    "openai-codex>=0.147.0",
    "huggingface_hub>=0.24",
    "prompt-toolkit>=3.0.48",
    "numpy",
    "imageio>=2.0",
]

[project.scripts]
parallelworld-manipulation = "parallelworld_manipulation.cli.main:main"

[project.optional-dependencies]
gpt-image = [
    "openai>=3.5.0",
    "pillow>=10",
]
rlinf = [
    "rpent-rlinf",
]
openpi = [
    "rlinf-openpi",
]
libero = [
    "rlinf-libero",
    "h5py",
]
libero-pro = [
    "parallelworld-manipulation[libero]",
    "rpent-liberopro",
]
libero-plus = [
    "parallelworld-manipulation[libero]",
    "rlinf-liberoplus",
]
full = [
    "parallelworld-manipulation[rlinf,openpi,libero-pro,sam3]",
]
sam3 = [
    "sam3==0.1.4",
    "torch",
    "torchvision",
    "pillow>=10",
]

[tool.uv]
prerelease = "allow"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["parallelworld_manipulation*"]
exclude = ["tests*", "docs*", "examples*", "docker*", "toolkits*"]

[tool.setuptools.package-data]
"parallelworld_manipulation.dashboard" = ["*.html", "static/*.css", "static/*.js"]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py311"

[tool.ruff.lint]
isort = {known-first-party = ["parallelworld_manipulation"]}
select = ["C", "E", "F", "I", "W", "CPY001", "RUF013", "UP006", "PERF102", "PLC1802", "PLC0208", "DOC102", "DOC202", "DOC403", "DOC502"]
ignore = [
    "C901", # "complex-structure"
    "E501", # "line-too-long"
    "E741", # "ambiguous-variable-name"
    "D100", # "Missing docstring in public module"
    "D104", # "Missing docstring in public package"
    "D203", # "incorrect-blank-line-before-class", conflict with D211,
    "D213", # "multi-line-summary-second-line", conflict with D212
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = true
docstring-code-line-length = "dynamic"
